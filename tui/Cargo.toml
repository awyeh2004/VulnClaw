[package]
name = "vulnclaw-tui"
version = "0.1.0"
edition = "2021"
description = "Terminal workbench for VulnClaw"

[[bin]]
name = "vulnclaw-tui-native"
path = "src/main.rs"

[dependencies]
crossterm = "0.28"
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
