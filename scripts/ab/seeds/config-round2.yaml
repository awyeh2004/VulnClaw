mcp:
  servers:
    burp:
      description: Burp Suite proxy integration for HTTP interception via SSE
      enabled: true
      name: burp
      priority: 0
      transport:
        args: null
        command: null
        env: null
        startup_timeout: 30000
        tool_timeout: 300000
        type: sse
        url: http://127.0.0.1:9876
    chrome-devtools:
      description: Browser automation for Web app pentest
      enabled: true
      name: chrome-devtools
      priority: 0
      transport:
        args:
        - -y
        - chrome-devtools-mcp@latest
        command: npx
        env: null
        startup_timeout: 30000
        tool_timeout: 300000
        type: stdio
        url: null
    fetch:
      description: HTTP request tool for API testing & web interaction
      enabled: true
      name: fetch
      priority: 0
      transport:
        args:
        - mcp-server-fetch
        command: uvx
        env: null
        startup_timeout: 30000
        tool_timeout: 300000
        type: stdio
        url: null
    memory:
      description: Context memory & session state persistence
      enabled: true
      name: memory
      priority: 0
      transport:
        args:
        - -y
        - '@modelcontextprotocol/server-memory'
        command: npx
        env: null
        startup_timeout: 30000
        tool_timeout: 300000
        type: stdio
        url: null
